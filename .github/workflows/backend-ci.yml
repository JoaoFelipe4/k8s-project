name: Backend CI

on:
  push:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'app/backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Permissoes necessarias para o GitHub solicitar o token OIDC
    permissions:
      id-token: write
      contents: read
      
    defaults:
      run:
        working-directory: ./app/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './app/backend/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      # --- Integração com AWS ECR via OIDC ---
      
      # Descomente e preencha com seus dados quando o OIDC estiver configurado na AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::364337333396:role/GitHubActions-ECR-Push-Role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          # Exemplo de build local apenas
          docker build -t backend-service:${{ github.sha }} .
          
          # Exemplo de build e push para ECR (descomente apos configurar a etapa anterior)
          # REGISTRY=${{ steps.login-ecr.outputs.registry }}
          # REPOSITORY=meu-repositorio-ecr
          # IMAGE_TAG=${{ github.sha }}
          # docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          # docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
