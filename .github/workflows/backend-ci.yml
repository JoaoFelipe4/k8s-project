name: Backend CI

on:
  push:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'app/backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Permissoes necessarias para o GitHub solicitar o token OIDC
    permissions:
      id-token: write
      contents: write
      
    defaults:
      run:
        working-directory: ./app/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './app/backend/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      # --- Integração com AWS ECR via OIDC ---
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        run: |
          # Define as variáveis
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPOSITORY=k8s-project-backend
          IMAGE_TAG=${{ github.sha }}
          
          # Realiza o Build
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          
          # Envia as imagens para o ECR (SHA e Latest)
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: GitOps Write-Back (Update Kustomization)
        run: |
          # Navega ate a pasta da infraestrutura
          cd ../../k8s/base/backend
          
          # Atualiza a imagem no Kustomize com a nova tag dinamica (preservando o placeholder de seguranca ECR_REGISTRY)
          kustomize edit set image ECR_REGISTRY/k8s-project=ECR_REGISTRY/k8s-project-backend:${{ github.sha }}
          
          # Configura o Git e faz o commit automatico
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add kustomization.yaml
          git commit -m "chore: gitops update backend image to sha-${{ github.sha }} [skip ci]"
          git push
