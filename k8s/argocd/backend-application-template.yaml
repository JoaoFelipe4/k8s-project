apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/JoaoFelipe4/k8s-project.git'
    path: k8s/base/backend
    targetRevision: main
    kustomize:
      # Preencha a URL abaixo com o ID real da sua conta AWS antes de aplicar no seu cluster.
      # ATENCAO: Nunca comite o arquivo com o seu ID real no GitHub!
      images:
        - 'ECR_REGISTRY/k8s-project=YOUR_ACCOUNT_ID.dkr.ecr.us-east-2.amazonaws.com/k8s-project:latest'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
